{
    "version": 9,
    "name": "vulkan-engine Q1 (ericw-tools)",
    "experimental": true,
    "faceattribs": {
        "surfaceFlags": [
            { "name": "light", "description": "Emit light from this face (surface light)." },
            { "name": "slick", "description": "Low-friction surface." },
            { "name": "sky", "description": "Sky surface (depth-preserving)." },
            { "name": "warp", "description": "Liquid/warp surface (animated, two-sided)." },
            { "name": "trans33", "description": "33% transparent alpha surface." },
            { "name": "trans66", "description": "66% transparent alpha surface." },
            { "name": "flowing", "description": "Flowing liquid (animated UV scroll)." },
            { "name": "nodraw", "description": "Not rendered (clip, trigger, hint, skip)." },
            { "name": "hint", "description": "Hint face — split BSP tree, not rendered." },
            { "name": "skip", "description": "Skip face — omit from BSP entirely." }
        ],
        "contentFlags": [
            { "name": "solid", "description": "Solid to all hulls." },
            { "name": "water", "description": "Water volume (swimmable)." },
            { "name": "slime", "description": "Slime volume (damaging)." },
            { "name": "lava", "description": "Lava volume (high damage)." },
            { "name": "sky", "description": "Sky volume." },
            { "name": "origin", "description": "Origin brush for rotating entities." },
            { "name": "clip", "description": "Clip brush — solid but not rendered." },
            { "name": "trigger", "description": "Trigger volume — fires events on touch." }
        ]
    },
    "entities": {
        "definitions": [ "Engine.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "modelformats": [ "mdl" ]
    },
    "brushtypes": [
        { "name": "default" }
    ],
    "textures": {
        "package": "wad",
        "format": { "extensions": [ "" ], "format": "idtech1wad" },
        "attribute": "_tb_textures",
        "excludes": "\n*_\n",
        "palette": "palette.lmp"
    },
    "compilationTools": [
        {
            "name": "QBSP (BSP29)",
            "description": "Compile to BSP29 with ericw-tools qbsp.",
            "parameters": "qbsp \"${WORK_DIR_PATH}/${MAP_BASE_NAME}.map\" \"${MAP_BASE_NAME}.bsp\""
        },
        {
            "name": "VIS",
            "description": "Compute BSP visibility.",
            "parameters": "vis \"${MAP_BASE_NAME}.bsp\""
        },
        {
            "name": "LIGHT (colored + .lit)",
            "description": "Bake lightmaps with colored lighting and external .lit.",
            "parameters": "light -colored -lit \"${MAP_BASE_NAME}.bsp\""
        }
    ]
}
