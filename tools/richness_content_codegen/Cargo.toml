[package]
name = "richness_content_codegen"
version = "0.1.0"
edition = "2021"
description = "Offline RON catalog validator and deterministic Rust constant generator for EnhancedV3 Richness V1"

[dependencies]
ron = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
