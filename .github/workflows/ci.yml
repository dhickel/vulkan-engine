name: Engine CPU CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────
  format:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Full workspace check ───────────────────────────────────────────────
  check:
    name: cargo check --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libclang-dev \
            libvulkan-dev \
            libasound2-dev \
            libassimp-dev \
            glslc \
            cmake \
            pkg-config
      - name: Locate libclang
        run: echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - name: cargo check --workspace
        run: cargo check --workspace

  # ── Renderer examples ──────────────────────────────────────────────────
  check-examples:
    name: cargo check -p renderer --examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libclang-dev \
            libvulkan-dev \
            libasound2-dev \
            libassimp-dev \
            glslc \
            cmake \
            pkg-config
      - name: Locate libclang
        run: echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - name: cargo check -p renderer --examples
        run: cargo check -p renderer --examples

  # ── Dogfood application ────────────────────────────────────────────────
  check-dogfood:
    name: cargo check -p dungeon_dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libclang-dev \
            libvulkan-dev \
            libasound2-dev \
            libassimp-dev \
            glslc \
            cmake \
            pkg-config
      - name: Locate libclang
        run: echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - name: cargo check -p dungeon_dogfood
        run: cargo check -p dungeon_dogfood

  # ── Input crate tests ──────────────────────────────────────────────────
  test-input:
    name: cargo test -p input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p input
        run: cargo test -p input

  # ── Events crate tests ─────────────────────────────────────────────────
  test-events:
    name: cargo test -p engine_events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p engine_events
        run: cargo test -p engine_events

  # ── Renderer CPU tests ─────────────────────────────────────────────────
  test-renderer:
    name: cargo test -p renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libclang-dev \
            libvulkan-dev \
            libasound2-dev \
            libassimp-dev \
            glslc \
            cmake \
            pkg-config
      - name: Locate libclang
        run: echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - name: cargo test -p renderer
        run: cargo test -p renderer

  # ── Physics crate tests ────────────────────────────────────────────────
  test-physics:
    name: cargo test -p physics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p physics
        run: cargo test -p physics

  # ── Audio crate tests ──────────────────────────────────────────────────
  test-audio:
    name: cargo test -p audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libasound2-dev
      - name: cargo test -p audio
        run: cargo test -p audio

  # ── Scripting crate tests ──────────────────────────────────────────────
  test-scripting:
    name: cargo test -p scripting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p scripting
        run: cargo test -p scripting

  # ── Remaining workspace package tests ─────────────────────────────────
  test-remaining-workspace:
    name: cargo test (engine, launch_shared, engine_pack, dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libclang-dev \
            libvulkan-dev \
            libasound2-dev \
            libassimp-dev \
            glslc \
            cmake \
            pkg-config
      - name: Locate libclang
        run: echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - name: Test remaining workspace packages
        run: cargo test -p engine -p launch_shared -p engine_pack -p dungeon_dogfood

  # ── Richness golden vectors x86-64 ────────────────────────────────────
  richness-vectors-x86_64:
    name: richness golden vectors (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test richness golden vectors (debug)
        run: cargo test -p bsp_generator --lib richness::vectors
      - name: cargo test richness golden vectors (release)
        run: cargo test --release -p bsp_generator --lib richness::vectors

  # ── Richness golden vectors AArch64 ───────────────────────────────────
  richness-vectors-aarch64:
    name: richness golden vectors (AArch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test richness golden vectors (debug)
        run: cargo test -p bsp_generator --lib richness::vectors
      - name: cargo test richness golden vectors (release)
        run: cargo test --release -p bsp_generator --lib richness::vectors
