workspace = { members = ["src/input", "src/renderer", "src/audio", "src/physics", "src/scripting", "src/events", "src/launch_shared", "src/bsp", "src/bsp_runtime", "src/bsp_generator", "src/package_io", "apps/dungeon_dogfood", "apps/voxel_demo", "apps/bsp_beta", "tools/engine_pack", "tools/dungeon_gen", "tools/richness_content_codegen"], exclude = [".internal-dev/spikes/voxel-cave"] }

[package]
name = "engine"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
debug-draw = ["renderer/debug-draw"]

[dependencies]
env_logger = "0.11"
log = "0.4"
renderer = { path = "src/renderer" }
engine_events = { path = "src/events" }
input = { path = "src/input" }
launch_shared = { path = "src/launch_shared" }
winit = "0.29"

[patch.crates-io]
#raw-window-handle = "0.6.2"
#ash = "0.38.0"

imgui-rs-vulkan-renderer = { git = "https://github.com/dhickel/imgui-rs-vulkan-renderer", branch = "dev" }
