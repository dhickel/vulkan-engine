[package]
name = "bsp_runtime"
version = "0.1.0"
edition = "2021"
description = "Transactional source-linked BSP runtime integration coordinator"

[dependencies]
package_io = { path = "../package_io" }
bsp = { path = "../bsp" }
renderer = { path = "../renderer", features = ["bsp"] }
engine_events = { path = "../events" }
glam = { version = "0.28", default-features = false, features = ["libm"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
