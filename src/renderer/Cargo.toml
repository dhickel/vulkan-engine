[package]
name = "renderer"
version = "0.1.0"
edition = "2021"
#build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]

[features]
default = []
# Opt-in feature gate for alpha/unstable advanced rendering interop.
# When enabled, exposes:
#   - renderer::api::advanced (unsafe renderer_core_mut for raw backend access)
#   - renderer::rendergraph (custom pass registration, no safety validation)
# These APIs may change across alpha sprints without notice.
advanced-interop = []

# Feature gates for engine-integration sprint rendering paths.
# All excluded from `default`. Compile-only in Phase 01; runtime activation
# is added when each track's evidence branch passes.
csm = []
instancing = []
scene-bvh = []


[dependencies]
cfg-if = "1"


ash = { version = "0.38.0", features = ["linked"] }
ash-window = { version = "0.13.0" }
vk-mem = "0.4.0"
raw-window-handle = { version = "0.6.2", features = ["std"] }

gltf = { version = "1.4.1" }
mikktspace = { version = "0.3.0", default-features = false, features = ["glam"] }
russimp-sys-ng = "2.0.6"

image = "0.25.1"
intel_tex_2 = "0.5.0"
half = "2.4.1"
backtrace = "0.3"

winit = { version = "0.29.15", features = ["rwh_06"] }
#glfw = { version = "0.56.0", default-features = false, features = ["vulkan", "ash", "raw-window-handle-v0-6"] }

imgui-rs-vulkan-renderer = { version = "1.12.0", features = ["vk-mem", "dynamic-rendering"] }
imgui = "0.12.0"
imgui-winit-support = "0.12.0"



env_logger = "0.10"
log = "0.4"
input = { path = "../input" }
engine_events = { path = "../events" }
glam = { version = "0.28.0", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.16.0", features = ["derive"] }
percent-encoding = "2.3.1"
notify = "6"
once_cell = "1.19.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"





