schema = "enhanced-v3-fixture-cases/v1"
profile = "ericw-q1-bsp2-generated"

[[cases]]
id = "pointed-portal"
map_file = "pointed-portal"
description = "Two large chambers connected by a full-depth pointed-arch portal"
minimum_source_brushes = 50
expect_bsp2 = true
expect_lit = true
min_solid_leaves = 1
min_empty_leaves = 2
min_clipnodes = 16

[[cases.witnesses]]
id = "portal-throat-center"
description = "Center of the complete wall-depth throat is empty"
expected_pass = true
query_coords = [[480.0, 512.0, 96.0], [504.0, 512.0, 96.0], [528.0, 512.0, 96.0]]
tolerance = 1.0

[[cases.witnesses]]
id = "portal-jamb-solid"
