# BSP Beta — Package Manifest
#
# Canonical package manifest for the BSP beta dogfood application.
# Declares the bundled BSP map, companion files, palettes, and model mappings
# used by the BSP beta runtime for loading and rendering.
#
# Format version: 1

format_version = 1
asset_id = "bsp-beta-core"
display_name = "BSP Beta Core"
bsp_path = "maps/beta_core.bsp"
palette_path = "palettes/project_palette.lmp"
strict = true

# ── Scale / calibration ───────────────────────────────────────────

scale_override = 0.03125  # 1/32: Quake units to meters

[lighting_calibration]
overbright = 2.0
light_scale = 1.0
saturation = 1.0

# ── Companion bindings ────────────────────────────────────────────

[[companion_bindings]]
kind = "palette"
path = "palettes/project_palette.lmp"
content_hash = "056225760af497967cb7fc67aba0757e915e2f461ba909d440e8073d591c5dd0"

[[companion_bindings]]
kind = "lit"
path = "maps/beta_core.lit"
# Content hash of the minimal QLIT v1 header (no RGB payload — map has no visible faces):
content_hash = "0b46b6b85a8ec0a4a3b905c059f73485e06e6bf452df80823f4ebb87b029fe36"

