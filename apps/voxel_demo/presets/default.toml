# Voxel Cave Demo — default preset
# A balanced cave with moderate tunnels, caverns, and maze density.

schema_version = 2
generator_version = 2
rng_version = 2

[generator]
seed = 0
resolution = 96
shell_thickness = 2
cavern_count = 7
tunnel_count = 9
tunnel_radius_min = 1.5
tunnel_radius_max = 3.0
cavern_radius_min = 4.0
cavern_radius_max = 8.0
spline_tension = 0.5
roughness = 0.3
maze_density = 0.15
