# Voxel Cave Demo — cavernous preset
# Large, open caverns with few tunnels and minimal maze.

schema_version = 2
generator_version = 2
rng_version = 2

[generator]
seed = 0
resolution = 96
shell_thickness = 2
cavern_count = 5
tunnel_count = 6
tunnel_radius_min = 2.5
tunnel_radius_max = 4.5
cavern_radius_min = 6.0
cavern_radius_max = 12.0
spline_tension = 0.3
roughness = 0.2
maze_density = 0.05
