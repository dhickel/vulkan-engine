# Voxel Cave Demo — tight preset
# Cramped passages with small radii, low cavern count, high roughness.

schema_version = 2
generator_version = 2
rng_version = 2

[generator]
seed = 0
resolution = 64
shell_thickness = 4
cavern_count = 5
tunnel_count = 5
tunnel_radius_min = 0.8
tunnel_radius_max = 1.5
cavern_radius_min = 3.5
cavern_radius_max = 4.0
spline_tension = 0.6
roughness = 0.5
maze_density = 0.2
maze_twistiness = 0.5
maze_radius = 0.8
maze_retries = 60
maze_search_budget = 20000
