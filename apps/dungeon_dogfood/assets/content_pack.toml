version = 1

[deterministic]
prop_selector = "marker_modulo"
light_selector = "marker_modulo_7_2_1"

[[props]]
id = "prop_wall_torch"
enabled = true
path = "apps/dungeon_dogfood/assets/models/props/torch_sconce/scene.gltf"
prefer_unlit_fallback = true
scale = [1.0, 1.0, 1.0]
yaw_degrees = 0.0
y_offset = 0.0
placement_half_extents = [0.3, 0.5, 0.3]

[[props]]
id = "prop_floor_crate"
enabled = true
path = "apps/dungeon_dogfood/assets/models/props/crate_a/wooden_crate_01_4k.gltf"
prefer_unlit_fallback = false
scale = [1.0, 1.0, 1.0]
yaw_degrees = 0.0
y_offset = 0.0
placement_half_extents = [0.5, 0.6, 0.5]

[[materials]]
id = "stone_wall"
family = "pbr"
base_path = "assets/dungeon_crawler_png/KB3D_DGC_STDarkCastleWall"

[[materials]]
id = "stone_floor"
family = "pbr"
base_path = "assets/dungeon_crawler_png/KB3D_DGC_STDarkPolishRectFloor"

[[environments]]
id = "env_dungeon_neutral"
path = "apps/dungeon_dogfood/assets/environments/dungeon_neutral.exr"
mode = "auto"

[[audio_clips]]
id = "dogfood.audio.startup_ping"
path = "apps/dungeon_dogfood/assets/audio/startup_ping.wav"
format = "wav"
usage = "ui"
default_gain = 0.15

[[light_presets]]
id = "warm"
color = [1.0, 0.6, 0.3]
intensity = 30.0
range = 6.0

[[light_presets]]
id = "cool"
color = [0.55, 0.68, 1.0]
intensity = 24.0
range = 6.5

[[light_presets]]
id = "accent"
color = [0.92, 0.25, 1.0]
intensity = 38.0
range = 5.0
