[package]
name = "dungeon_dogfood"
version = "0.1.0"
edition = "2021"
default-run = "dungeon_dogfood"

[features]
default = ["runtime"]
runtime = ["dep:engine", "dep:renderer", "dep:input", "dep:audio", "dep:physics", "dep:winit"]
generator-bench = []
generator-bench-alloc = ["generator-bench"]

[dependencies]
engine = { path = "../..", optional = true }
renderer = { path = "../../src/renderer", optional = true }
input = { path = "../../src/input", optional = true }
audio = { path = "../../src/audio", optional = true }
physics = { path = "../../src/physics", optional = true }
glam = "0.28"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
winit = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "generator_bench"
path = "src/bin/generator_bench.rs"
required-features = ["generator-bench"]
