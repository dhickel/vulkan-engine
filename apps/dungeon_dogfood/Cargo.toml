[package]
name = "dungeon_dogfood"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../.." }
renderer = { path = "../../src/renderer" }
input = { path = "../../src/input" }
audio = { path = "../../src/audio" }
physics = { path = "../../src/physics" }
glam = "0.28"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
winit = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
